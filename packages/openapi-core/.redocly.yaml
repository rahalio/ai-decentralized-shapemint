apis:
  identity:
    root: src/identity.yaml
  models:
    root: src/models.yaml
  contributions:
    root: src/contributions.yaml
  influence:
    root: src/influence.yaml
  protocols:
    root: src/protocols.yaml
  incentives:
    root: src/incentives.yaml
  governance:
    root: src/governance.yaml
  reporting:
    root: src/reporting.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
