openapi: 3.1.0
info:
  title: Shapemint Protocols API
  version: 0.1.0
  description: |
    Evaluation protocols defining in-scope behaviours for influence scoring (BR-8).
  license:
    name: Proprietary
    url: https://shapemint.local/license
  x-domain: prt
servers:
  - url: https://api.shapemint.local
    description: Shapemint API
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - name: Protocols
    description: In-scope evaluation protocols
paths:
  /v1/protocols:
    get:
      operationId: listProtocols
      tags: [Protocols]
      summary: List evaluation protocols
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: modelId
          in: query
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/ModelId
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProtocolStatus'
      responses:
        '200':
          description: Protocols page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolListResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createProtocol
      tags: [Protocols]
      summary: Create an evaluation protocol (draft)
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolCreateRequest'
      responses:
        '201':
          description: Protocol created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/protocols/{protocolId}:
    parameters:
      - name: protocolId
        in: path
        required: true
        schema:
          $ref: ./common/primitives.yaml#/components/schemas/ProtocolId
    get:
      operationId: getProtocol
      tags: [Protocols]
      summary: Get evaluation protocol
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Protocol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/protocols/{protocolId}/publish:
    post:
      operationId: publishProtocol
      tags: [Protocols]
      summary: Publish a protocol version so contributions may score
      security:
        - bearerAuth: []
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/ProtocolId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Protocol published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/protocols/{protocolId}/deprecate:
    post:
      operationId: deprecateProtocol
      tags: [Protocols]
      summary: Deprecate a published protocol
      security:
        - bearerAuth: []
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/ProtocolId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Protocol deprecated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/protocols/{protocolId}/bind-model:
    post:
      operationId: bindProtocolToModel
      tags: [Protocols]
      summary: Bind protocol to a model registry entry
      security:
        - bearerAuth: []
      parameters:
        - name: protocolId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/ProtocolId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolBindRequest'
      responses:
        '200':
          description: Protocol bound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth

  schemas:
    ProtocolStatus:
      type: string
      enum: [draft, published, deprecated]
    EvaluationProtocol:
      type: object
      required: [protocolId, modelId, name, version, inScopeBehaviours, status, createdAt, updatedAt]
      properties:
        protocolId:
          $ref: ./common/primitives.yaml#/components/schemas/ProtocolId
        modelId:
          $ref: ./common/primitives.yaml#/components/schemas/ModelId
        name:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 64
        inScopeBehaviours:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Published behaviours that count for influence (BR-8)
        status:
          $ref: '#/components/schemas/ProtocolStatus'
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProtocolCreateRequest:
      type: object
      required: [modelId, name, version, inScopeBehaviours]
      properties:
        modelId:
          $ref: ./common/primitives.yaml#/components/schemas/ModelId
        name:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 64
        inScopeBehaviours:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    ProtocolBindRequest:
      type: object
      required: [modelId]
      properties:
        modelId:
          $ref: ./common/primitives.yaml#/components/schemas/ModelId
    ProtocolResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/EvaluationProtocol'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    ProtocolListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationProtocol'
    ProtocolListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ProtocolListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
